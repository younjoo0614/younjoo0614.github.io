<!DOCTYPE html>
<!--
	CV layout: extends forty's page chrome with an academic-style banner and content body.
-->
<html>

{% include head.html %}

<body class="is-preload">

	{% include header.html %}

	<!-- Banner -->
	<section id="banner" class="major">
		<div class="inner">
			<header class="major">
				<h1>{{ page.title }}</h1>
			</header>
			{% if page.description %}
			<div class="content">
				<p>{{ page.description }}</p>
			</div>
			{% endif %}
		</div>
	</section>

	<!-- Main -->
	<div id="main" class="alt">
		<section id="cv-content">
			<div class="inner">
				{{ content }}
			</div>
		</section>
	</div>

	{% include footer.html %}

</body>

</html>

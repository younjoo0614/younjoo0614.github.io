<!-- Wrapper -->
<div id="wrapper">

<!-- Header -->
<header id="header"{% if page.layout == "landing" %} class="alt style2"{% endif %}{% if page.layout == "home" %} class="alt"{% endif %}>
	<a href="{{ "/" | relative_url }}" class="logo"><strong>{{ site.title }}</strong> <span>{{ site.subtitle }}</span></a>
	<nav>
		<a href="#menu">Menu</a>
	</nav>
</header>

<!-- Menu -->
<nav id="menu">
	<ul class="links">
		{% for item in site.data.navigation.main %}
			<li><a href="{{ item.url | relative_url }}">{{ item.title }}</a></li>
		{% endfor %}
	</ul>
	<ul class="actions vertical">
		<li><a href="{{ '/cv/' | relative_url }}" class="button special fit">View CV</a></li>
		{% if site.socials.GitHub %}
			<li><a href="{{ site.socials.GitHub }}" class="button fit" target="_blank" rel="noopener">GitHub</a></li>
		{% endif %}
	</ul>
</nav>

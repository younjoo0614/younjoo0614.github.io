# Site settings
title: Younjoo Lee
subtitle: Academic CV
email: younjoo0614@snu.ac.kr
description: >-
  Personal academic website of Younjoo &mdash; CV, publications, talks and teaching.
# Leave baseurl empty when serving from a user/organization site (USERNAME.github.io).
baseurl: ""
url: "https://younjoo0614.github.io"

# Author / profile (used on the homepage banner and the CV page)
author:
  name: Younjoo Lee
  avatar: /assets/images/profile.jpg
  bio: >-
    Hi! I am Younjoo, a graduate student at Seoul National University supervised by Prof. Jung Ho Ahn.
    My research interests include AI systems, computer architecture, and diffusion LLMs. 
    I believe my research can help shape the future of AI and computing, 
    and I am committed to turning that belief into impact through rigorous research and collaboration.
  latest_publication_label: My latest research on diffusion LLMs
  latest_publication_title: "DyLLM"
  latest_publication_url: https://arxiv.org/abs/2603.08026
  location: Seoul, Republic of Korea
  employer: Seoul National University

# Contact info (used by forty's footer contact section)
# Address/phone temporarily disabled. Uncomment when you want to restore.
# street_address:
# city:
# state:
# zip_code:
# country:
# phone:

# Homepage tile config (kept for compatibility with forty includes)
tiles-source: pages
tiles-count: 4

# Social settings - key must match name of font awesome icon
# Icons are not shown if value is empty
socials:
  GitHub: https://github.com/younjoo0614
  LinkedIn: https://www.linkedin.com/in/younjoo-lee-b98b1a276
  Twitter:
  Google-Plus:
  Instagram:
  GitLab:
  Facebook:
  Slack:

# Build settings
markdown: kramdown
sass:
  style: compressed

# Jekyll collections (academicpages-style content architecture)
collections:
  publications:
    output: true
    permalink: /:collection/:path/
  projects:
    output: true
    permalink: /:collection/:path/
  life:
    output: true
    permalink: /:collection/:path/

# Default front-matter per scope so collection items get the right layout
defaults:
  - scope:
      path: ""
      type: publications
    values:
      layout: archive-single
  - scope:
      path: ""
      type: projects
    values:
      layout: archive-single
  - scope:
      path: ""
      type: life
    values:
      layout: archive-single
  - scope:
      path: ""
      type: posts
    values:
      layout: post

include:
  - _pages

exclude:
  - "*.gemspec"
  - LICENSE.md
  - CONTRIBUTING.md
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - .bundle
